repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ty-check
        name: Ty syntax and type check
        entry: uv run ty check ilive test
        language: system
        pass_filenames: false
        types: [python]
